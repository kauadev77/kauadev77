name: CI

on:
  push:
    paths:
      - "projects/fastapi-production-template/**"
  pull_request:
    paths:
      - "projects/fastapi-production-template/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/fastapi-production-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
